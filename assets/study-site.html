.header{min-height:79px;background:#fff;border-bottom:1px solid var(--line);padding:14px 23px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;gap:12px;align-items:center;min-width:0}.mark{width:41px;height:41px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:25px;line-height:1;flex:none}.eyebrow{font-size:11px;letter-spacing:1px;color:var(--muted)}.brand h1{overflow-wrap:anywhere}.tabs{display:flex;background:#f0f4f6;border-radius:9px;padding:4px;gap:2px;flex:none}.tabs button{border:0;background:transparent;padding:8px 14px;font-size:14px;color:var(--muted)}.tabs button.active{background:#fff;color:var(--ink)}.toolbar{min-height:67px;background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:10px}.chapters{display:flex;gap:3px;padding:3px;border:1px solid var(--line);background:#f4f7f8;border-radius:9px;max-width:44%;overflow:auto;scrollbar-width:thin}.chapters button{white-space:nowrap;border:0;background:transparent;font-size:13px;padding:7px 10px}.chapters button.active{background:var(--accent-soft)}.search{flex:1;min-width:140px;max-width:380px}.search input{width:100%;height:42px;border:1px solid var(--line);background:#f8fafb;border-radius:8px;padding:8px 13px;font-size:14px}.toolbar>.filter{font-size:13px;white-space:nowrap}.hint{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}.mobile-outline{display:none}
.workspace{display:grid;grid-template-columns:218px minmax(300px,1fr) 365px;height:calc(100dvh - 146px);min-height:500px}.sidebar{overflow:auto;background:#fff;border-right:1px solid var(--line);padding:21px 13px}.sidebar-label{font-size:12px;color:var(--muted);letter-spacing:.7px;margin:0 8px 13px}.overview{width:100%;text-align:left;border:0;background:#eff5f8;font-size:14px;margin-bottom:15px}.branch{display:block;width:100%;border:0;text-align:left;background:transparent;padding:10px 8px;margin:3px 0}.branch:hover{background:#f4f8fa;border-color:transparent}.branch.active{background:var(--accent-soft);color:#086b67}.branch-main{font-size:14px}.branch-info{display:block;color:var(--muted);font-size:12px;margin-top:4px}.branch-info b{background:var(--gold-soft);color:var(--gold);font-weight:500;padding:1px 4px}.progress{border-top:1px solid var(--line);margin-top:17px;padding:18px 8px}.progress strong{display:block;font-size:23px}.track{height:5px;background:#e8eef1;border-radius:3px;margin:8px 0;overflow:hidden}.fill{height:100%;background:var(--accent)}.progress-actions{display:flex;gap:6px;margin-top:12px}.progress-actions button{font-size:12px;padding:6px 8px}.map-area{position:relative;overflow:hidden;background:#f8fafc;background-image:radial-gradient(#d8e3eb .75px,transparent .75px);background-size:23px 23px}.map-header{position:absolute;z-index:1;top:19px;left:21px;pointer-events:none}.map-header h2{font-size:16px;margin:0 0 3px}.map-header p{font-size:12px;color:var(--muted);margin:0}.map-svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:grab}.map-svg.dragging{cursor:grabbing}.map-link{fill:none;stroke:#8eb9c6;stroke-width:2;opacity:.64}.map-link.other{stroke:#a6bada}.node{cursor:pointer}.node rect{fill:#fff;stroke:#c5d8e3;stroke-width:1.3}.node:hover rect{fill:#f1f8f8}.node.selected rect{stroke:var(--accent);stroke-width:2.3;fill:#f0faf8}.node.key rect{stroke:#c29b51}.node.mastered rect{fill:#ebf7f1}.node.root rect{fill:#204455;stroke:#204455}.node text{fill:var(--ink);font:15px var(--font);text-anchor:middle}.node .sub{font-size:11px;fill:var(--muted)}.node.root text{fill:white;font-weight:600;font-size:18px}.node.root .sub{fill:#c3dfe2;font-weight:400;font-size:11px}.node .dot{fill:#ba8224}.toggle circle{fill:white;stroke:#b9cfda;stroke-width:1.3}.toggle text{font:17px var(--font);fill:#54717f}.map-tools{position:absolute;left:15px;bottom:46px;display:flex;gap:2px;background:#fffffff2;border:1px solid var(--line);border-radius:9px;padding:4px}.map-tools button{border:0;padding:7px 9px;font-size:13px}.map-tools .scale{font:12px Consolas,monospace;color:var(--muted);align-self:center;min-width:42px;text-align:center}.map-foot{height:34px;position:absolute;bottom:0;left:0;right:0;background:#f8fafceb;border-top:1px solid var(--line);padding:7px 15px;font-size:11px;color:var(--muted)}.search-results{position:absolute;z-index:3;inset:8px 8px 42px;background:#fffffffa;border:1px solid var(--line);border-radius:10px;overflow:auto;padding:17px}.search-results h3{margin-bottom:12px}.result{display:block;text-align:left;width:100%;margin-bottom:7px;padding:11px}.result b{display:block}.result small{display:block;margin-top:4px;line-height:1.6}.empty-map{position:absolute;top:42%;left:15%;right:15%;text-align:center;background:white;border:1px solid var(--line);padding:17px;border-radius:8px}
.detail{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:23px}.crumb{font-size:12px;color:var(--muted);margin-bottom:11px}.badges{display:flex;gap:5px;margin-bottom:9px}.badge{background:#ecf3f6;color:#496a7a;padding:3px 7px;border-radius:4px;font-size:11px}.badge.key{background:var(--gold-soft);color:var(--gold)}.badge.done{background:#eaf5ec;color:#147045}.detail h2{font-size:21px;overflow-wrap:anywhere}.detail .passage{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;margin:13px 0}.source-bold,.answer strong{background:#fff0c7;color:#74500b;font-weight:750}.source-underline,.answer u{background:#fff8e5;text-decoration-color:#af7214;text-decoration-thickness:2px;text-underline-offset:4px}.figure{margin:18px 0}.figure button{width:100%;padding:8px;background:#fbfcfd}.figure img{display:block;width:100%;height:auto;max-height:390px;object-fit:contain}.figure figcaption{font-size:12px;color:var(--muted);margin-top:5px}.summary{font-size:14px;color:#4a6474;border-left:2px solid #b4cfd6;padding-left:12px;line-height:1.8;margin:15px 0}.children{display:grid;gap:7px;margin:19px 0}.children button{text-align:left;display:flex;justify-content:space-between;gap:9px;font-size:14px}.children small{white-space:nowrap}.detail-actions{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.detail-actions button{font-size:13px}.source-line{border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted);margin-top:20px}

[hidden]{display:none!important}dialog{max-width:95vw;max-height:94dvh;border:1px solid var(--line);border-radius:10px;padding:18px;background:#fff;color:var(--ink)}dialog::backdrop{background:#1833459c}dialog img{max-width:88vw;max-height:76dvh;object-fit:contain;display:block;margin:auto}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:10px;font-size:14px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#204455;color:white;padding:9px 14px;border-radius:8px;z-index:10;font-size:13px}
@media(max-width:1150px){.workspace{grid-template-columns:180px minmax(280px,1fr) 325px}.study{grid-template-columns:180px 1fr}.sidebar{padding:17px 8px}.hint{display:none}}
@media(max-width:900px){.workspace{grid-template-columns:minmax(280px,1fr) 315px}.workspace>.sidebar,.study>.sidebar{display:none}.study{display:block}.mobile-outline{display:inline-block}}
@media(max-width:680px){.header{min-height:104px;flex-wrap:wrap;align-content:space-between;padding:11px 15px}.brand{width:100%}.brand h1{font-size:16px}.mark{width:34px;height:34px;font-size:22px}.tabs{margin-left:auto;padding:2px}.tabs button{font-size:13px;padding:6px 11px}.toolbar{padding:9px 14px;display:flex;flex-wrap:wrap;gap:7px;min-height:138px}.chapters{order:0;max-width:100%;width:100%}.search{order:1;flex-basis:100%;max-width:none}.toolbar>.filter,.mobile-outline{order:2;font-size:12px;padding:6px 8px}.workspace{display:flex;flex-direction:column;height:auto;min-height:0}.map-area{height:620px;min-height:620px}.detail{border-left:0;border-top:1px solid var(--line);padding:20px;overflow:visible}.map-header{left:16px;top:14px}.map-tools{left:10px;bottom:43px}.map-tools button{font-size:12px;padding:7px}.map-foot{font-size:10px}.study{height:calc(100dvh - 104px)}.study .study-main{padding:22px 15px}.study-head h2{font-size:20px}.card{padding:24px 20px}.question{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<body>
<header class="header"><div class="brand"><div class="mark" aria-hidden="true">◇</div><div><div class="eyebrow">学习笔记 / 交互复习</div><h1 id="siteTitle">__STUDY_MAP_TITLE__</h1></div></div><nav class="tabs" aria-label="复习方式"><button id="mapTab" class="active" aria-pressed="true">思维导图</button><button id="studyTab" aria-pressed="false">翻卡自测</button></nav></header>
<div id="toolbar" class="toolbar"><nav id="chapterNav" class="chapters" aria-label="选择章节"></nav><div class="search"><input id="search" type="search" aria-label="搜索本章知识点" placeholder="搜索本章知识点" autocomplete="off"></div><button id="keyFilter" class="filter" aria-pressed="false">只看重点</button><button id="pendingFilter" class="filter" aria-pressed="false">只看待复习</button><button id="outlineBtn" class="mobile-outline">章节目录</button><span class="hint">加粗 / 下划线为原文重点</span></div>
<main id="mapMode" class="workspace"><aside id="outline" class="sidebar" aria-label="知识目录"></aside><section class="map-area" aria-label="思维导图"><div class="map-header"><h2 id="mapTitle"></h2><p>点击知识点阅读 · 点击 ＋ 展开 · 拖动空白处移动</p></div><svg id="map" class="map-svg" xmlns="http://www.w3.org/2000/svg" aria-label="交互知识导图"><g id="scene"><g id="links"></g><g id="nodes"></g></g></svg><div id="results" class="search-results" hidden></div><div id="emptyMap" class="empty-map" hidden>筛选后没有知识点。<br><button id="showAll" style="margin-top:10px">显示全部</button></div><div class="map-tools"><button id="zoomOut" aria-label="缩小">−</button><span id="scale" class="scale"></span><button id="zoomIn" aria-label="放大">＋</button><button id="fit">适应屏幕</button><button id="expandAll">全部展开</button><button id="collapseAll">收起</button></div><div id="mapFoot" class="map-foot"></div></section><aside id="detail" class="detail" aria-label="知识点详情"></aside></main>
<main id="studyMode" class="study" hidden><aside id="studyOutline" class="sidebar" aria-label="复习进度"></aside><section class="study-main"><div class="study-head"><div><div class="eyebrow">ACTIVE RECALL</div><h2>先回忆，再核对</h2><p id="studyChapter"></p><nav id="studyChapterNav" class="chapters" aria-label="自测章节" style="margin-top:13px;max-width:none"></nav></div><button id="shuffle">打乱顺序</button></div><div class="study-filters"><button id="deckAll" class="active">全部知识点</button><button id="deckKeys">原文重点</button><button id="deckPending">待复习</button><button id="deckBranch" hidden></button></div><article id="card" class="card"></article></section></main>
<dialog id="imageDialog"><div class="dialog-head"><span id="imageTitle"></span><button id="closeImage">关闭 ×</button></div><img id="largeImage" alt=""></dialog>
<dialog id="outlineDialog"><div class="dialog-head"><strong>知识目录</strong><button id="closeOutline">关闭 ×</button></div><div id="mobileOutline"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script id="studyData" type="application/json">__STUDY_MAP_DATA__</script>
<script>
(()=>{'use strict';
const D=JSON.parse(document.getElementById('studyData').textContent),$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const allById=new Map(),chapterNodes=D.chapters.map(c=>{const nodes=[];function walk(n,parent){n.parent=parent;nodes.push(n);allById.set(n.id,n);n.children.forEach(x=>walk(x,n.id))}walk(c.root,null);return nodes});
let chapter=0,C=D.chapters[0],root=C.root,all=chapterNodes[0],leaves=all.filter(n=>!n.children.length),selected=root.id,expanded=new Set([root.id]),mastered=new Set(),storageOK=true,mode='map',keyOnly=false,pendingOnly=false,query='',deckFilter='all',branchDeck=null,deck=[],card=0,revealed=false,zoom=1,panX=0,panY=0,positions=new Map(),visible=[],compact=false;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storageKey=()=>`document-study-map:${D.project_id}:${C.id}`;
function loadProgress(){try{mastered=new Set(JSON.parse(localStorage.getItem(storageKey())||'[]').filter(id=>leaves.some(n=>n.id===id)));localStorage.setItem(storageKey(),JSON.stringify([...mastered]));storageOK=true}catch{mastered=new Set();storageOK=false}}
function saveProgress(){try{localStorage.setItem(storageKey(),JSON.stringify([...mastered]))}catch{storageOK=false;notice('当前浏览器未保存进度')}renderOutlines()}
function notice(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('toast').hidden=true,2500)}
function pathOf(n){const names=[];while(n){names.unshift(n.title);n=allById.get(n.parent)}return names}
function leafCount(n){return n.children.length?n.children.reduce((s,c)=>s+leafCount(c),0):1}
function chapterNav(){return D.chapters.map((c,i)=>`<button data-chapter="${i}" class="${chapter===i?'active':''}" aria-pressed="${chapter===i}">${escapeHTML(c.title)}</button>`).join('')}
function outlineHTML(){const progress=mastered.size/leaves.length*100;return `<div class="sidebar-label">${escapeHTML(C.title)} · ${root.children.length} 个主题</div><button class="overview" data-select="${root.id}">◇ 全章概览</button>`+root.children.map((n,i)=>`<button class="branch ${selected!==root.id&&isDescendant(allById.get(selected),n)?'active':''}" data-select="${n.id}"><span class="branch-main">${String(i+1).padStart(2,'0')}　${escapeHTML(n.title)}</span><span class="branch-info">${leafCount(n)} 个知识点 ${n.key_count?`· <b>${n.key_count} 重点</b>`:''}</span></button>`).join('')+`<div class="progress"><span class="small">本章复习进度</span><strong>${mastered.size} <span class="small">/ ${leaves.length} 已掌握</span></strong><div class="track"><div class="fill" style="width:${progress}%"></div></div><div class="small">${C.stats.keys} 处原文重点 · ${C.stats.images} 张原图</div><div class="small">${storageOK?'进度保存在当前浏览器':'当前浏览器未保存进度'}</div><div class="progress-actions"><button data-export>备份进度</button><button data-import>恢复进度</button></div></div>`}
function isDescendant(n,parent){while(n){if(n.id===parent.id)return true;n=allById.get(n.parent)}return false}
function renderOutlines(){const html=outlineHTML();$('outline').innerHTML=html;$('studyOutline').innerHTML=html;$('mobileOutline').innerHTML=html;$('chapterNav').innerHTML=chapterNav();$('studyChapterNav').innerHTML=chapterNav();$('mapTitle').textContent=C.title+'知识脉络';$('studyChapter').textContent=C.title}
function runHTML(r){let s=escapeHTML(r.text);if(r.bold)s='<strong class="source-bold">'+s+'</strong>';if(r.underline)s='<u class="source-underline">'+s+'</u>';return s}
function blocksHTML(n){return n.blocks.map(b=>b.kind==='text'?`<p class="passage">${b.runs.map(runHTML).join('')}</p>`:`<figure class="figure"><button data-image="${b.image_id}" aria-label="放大图片"><img src="${D.images[b.image_id].src}" alt="${escapeHTML(D.images[b.image_id].alt)}"></button><figcaption>${escapeHTML(D.images[b.image_id].alt)} · 点击放大${b.location?' · '+escapeHTML(b.location):''}</figcaption></figure>`).join('')}
function detail(){const n=allById.get(selected),leaf=!n.children.length,done=mastered.has(n.id);$('detail').innerHTML=`<div class="badges"><span class="badge">${n===root?'全章概览':leaf?'知识点':'主题'}</span>${n!==root&&n.important?'<span class="badge key">原文重点</span>':''}${done?'<span class="badge done">已掌握</span>':''}</div><div class="crumb">${escapeHTML(pathOf(n).slice(0,-1).join(' / '))}</div><h2>${escapeHTML(n.title)}</h2>${n===root?'<p class="summary">从一个主题开始复习，点击节点可查看完整原文。</p>':''}${blocksHTML(n)}${n.summary?`<div class="summary"><b>整理说明</b><br>${escapeHTML(n.summary)}</div>`:''}${n.children.length?`<div class="children">${n.children.map(c=>`<button data-select="${c.id}">${escapeHTML(c.title)}<small>${c.children.length?'展开':c.important?'重点':'阅读'}</small></button>`).join('')}</div>`:''}<div class="detail-actions">${leaf?`<button class="${done?'active':'primary'}" data-master="${n.id}">${done?'✓ 已掌握 · 撤销':'标记已掌握'}</button><button data-quiz="${n.id}">自测此知识点</button>`:`<button class="primary" data-quiz-branch="${n.id}">自测${n===root?'全章':'本主题'}</button>`}</div><p class="source-line">来源：${escapeHTML(D.source)}<br>高亮的加粗和下划线按源文件保留。</p>`;$('detail').scrollTop=0}
function qualifies(n){return(!keyOnly||n.important)&&(!pendingOnly||!n.children.length&&!mastered.has(n.id))}
function showNode(n){return n===root||qualifies(n)||n.children.some(showNode)}
function visibleChildren(n){return n.children.filter(showNode)}
function svg(tag,attrs={},value=''){const el=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);if(value)el.textContent=value;return el}
function wrap(s,width=12){const a=Array.from(s);return a.length<=width?[s]:[a.slice(0,width).join(''),a.slice(width,width*2).join('')+(a.length>width*2?'…':'')]}
function layout(){visible=[root];positions=new Map([[root.id,{x:0,y:0,w:214,h:100,dir:0}]]);const branches=visibleChildren(root);compact=innerWidth<680&&expanded.size===1&&branches.length<=10;
 if(compact){const rows=Math.ceil(branches.length/2),top=-Math.max(145,rows*50+45);positions.set(root.id,{x:0,y:top,w:214,h:100,dir:0});branches.forEach((n,i)=>{const dir=i%2?-1:1;positions.set(n.id,{x:dir*103,y:top+122+Math.floor(i/2)*100,w:178,h:68,dir});visible.push(n)});return}
 const gap=20;function span(n){const kids=expanded.has(n.id)?visibleChildren(n):[];return kids.length?kids.reduce((s,c)=>s+span(c),0)+gap*(kids.length-1):68}
 function place(n,dir,depth,top){const size=span(n),p={x:dir*(245+(depth-1)*240),y:top+size/2,w:198,h:68,dir};positions.set(n.id,p);visible.push(n);let cursor=top;for(const child of expanded.has(n.id)?visibleChildren(n):[]){place(child,dir,depth+1,cursor);cursor+=span(child)+gap}}
 for(const dir of[-1,1]){const subset=branches.filter((_,i)=>i%2===(dir===1?0:1));const total=subset.reduce((s,n)=>s+span(n),0)+47*Math.max(0,subset.length-1);let y=-total/2;for(const n of subset){place(n,dir,1,y);y+=span(n)+47}}
}
